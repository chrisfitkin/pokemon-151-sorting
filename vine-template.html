<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attack of the Vine Binder Index</title>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:400 700;font-stretch:62% 125%;font-display:block;src:url(data:font/woff2;base64,/*__ARCHIVO__*/) format('woff2')}
@font-face{font-family:'PlexMono';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,/*__MONO4__*/) format('woff2')}
@font-face{font-family:'PlexMono';font-style:normal;font-weight:600;font-display:block;src:url(data:font/woff2;base64,/*__MONO6__*/) format('woff2')}

:root{
  --bg:#E4E8EA; --panel:#FBFBFA; --sunk:#EEF1F2;
  --ink:#12171A; --dim:#556168; --faint:#6E7A80; --line:#CCD4D8; --line-soft:#DDE3E6;
  --red:#BE3325; --red-ink:#BE3325; --red-soft:#F5DED9;
  --holo:#8A6317; --holo-ink:#7A5713; --holo-soft:#F2E6CB;
  --pocket:#DDE4E7; --pocket-line:#BAC5CB; --crease:rgba(0,0,0,.5); --ok:#1F7A55; --ok-soft:#DCEFE6;
  --shadow:0 1px 0 rgba(18,23,26,.04), 0 6px 22px -14px rgba(18,23,26,.45);
  --disp:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'PlexMono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1113; --panel:#171D20; --sunk:#12181A;
    --ink:#E8EEF0; --dim:#A2AFB5; --faint:#859399; --line:#273136; --line-soft:#1E272B;
    --red:#F2604F; --red-ink:#F2604F; --red-soft:#381914;
    --holo:#EFC069; --holo-ink:#E5B662; --holo-soft:#2C2313; --pocket:#2B353B; --pocket-line:#3E4A52;
    --crease:rgba(0,0,0,.92);
    --ok:#58D3A0; --ok-soft:#103125;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1113; --panel:#171D20; --sunk:#12181A;
  --ink:#E8EEF0; --dim:#A2AFB5; --faint:#859399; --line:#273136; --line-soft:#1E272B;
  --red:#F2604F; --red-ink:#F2604F; --red-soft:#381914;
  --holo:#EFC069; --holo-ink:#E5B662; --holo-soft:#2C2313; --pocket:#2B353B; --pocket-line:#3E4A52;
  --crease:rgba(0,0,0,.92);
  --ok:#58D3A0; --ok-soft:#103125;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--disp); font-stretch:100%;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* a tap or drag on a control is a press, never the start of a text selection,
   and a long press must not raise the iOS callout. Text outside controls stays
   selectable so a card name can still be copied. */
button{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--red); outline-offset:2px; border-radius:3px}

.app{max-width:540px; margin:0 auto}

/* ---------- header ---------- */
.bar{position:sticky; top:0; z-index:20; padding:8px 14px 9px; background:var(--bg); border-bottom:1px solid var(--line-soft)}
.top{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.crest{font-family:var(--disp); font-stretch:62%; font-weight:700; font-size:21px; line-height:1; color:var(--red-ink); flex:none}
.modes{display:flex; gap:2px; padding:2px; background:var(--sunk); border:1px solid var(--line-soft); border-radius:8px; flex:1; min-width:0}
.modes button{flex:1; padding:6px 4px; border-radius:6px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.04em; text-transform:uppercase; color:var(--dim); white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--panel); color:var(--ink); box-shadow:var(--shadow); font-weight:600}
.keytog{flex:none; padding:6px 9px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--dim)}
.keytog:hover{color:var(--red-ink); border-color:var(--red)}
.fxtog{padding:6px 8px; font-size:13px; line-height:1}
body.nofx .fxtog{color:var(--faint); border-style:dashed}
body.marking .owntog{color:var(--ok); border-color:var(--ok); background:var(--ok-soft)}
/* once the pad is hidden the way back has to be obvious */
body.nokeys .keytog{color:var(--red-ink); border-color:var(--red)}

.field{position:relative; display:flex; align-items:center}
.field input{width:100%; padding:11px 40px 11px 12px; border-radius:10px; border:1.5px solid var(--line);
  background:var(--panel); color:var(--ink); font-family:var(--mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--faint); font-weight:400; letter-spacing:0}
.field input:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 3px var(--red-soft)}
/* after a pause the entry is spent: show it as "selected" so the next digit clearly restarts */
body.stale .field input{background:var(--sunk); color:var(--dim)}
.wipe{
  position:absolute; right:6px; width:32px; height:32px; border-radius:50%;
  display:grid; place-items:center; color:var(--faint); font-size:19px; line-height:1;
}
.wipe[hidden]{display:none}
.hint{margin:7px 2px 0; font-family:var(--mono); font-size:10px; color:var(--faint)}
.hint[hidden]{display:none}
.hint b{color:var(--dim); font-weight:600}

/* ---------- main ---------- */
main{padding:12px 14px 0; display:flex; flex-direction:column; gap:11px}

.panel{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; box-shadow:var(--shadow)}

/* card head */
.head{display:flex; gap:14px; align-items:flex-start; padding:11px 12px 10px; border-bottom:1px solid var(--line-soft)}
.no{
  font-family:var(--disp); font-stretch:62%; font-weight:700; font-size:40px; line-height:.82;
  letter-spacing:.005em; font-variant-numeric:tabular-nums; flex:none; color:var(--ink);
}
.no i{font-family:var(--mono); font-style:normal; font-size:17px; font-weight:400; color:var(--faint); vertical-align:.34em; margin-right:1px}
.who{min-width:0; padding-top:2px}
.who h1{
  margin:0; font-family:var(--disp); font-stretch:80%; font-weight:600; font-size:19px;
  line-height:1.06; letter-spacing:-.005em; text-wrap:balance;
}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
  padding:3px 6px; border-radius:5px; background:var(--sunk); color:var(--dim); border:1px solid var(--line-soft);
}
.tag.hot{background:var(--red-soft); color:var(--red-ink); border-color:transparent; font-weight:600}

/* locations */
.locs{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-soft)}
.loc{background:var(--panel); padding:10px 11px 12px; display:flex; flex-direction:column; gap:7px}
.loc:first-child{border-bottom-left-radius:13px}
.loc:last-child{border-bottom-right-radius:13px}
.stripe{display:flex; align-items:center; gap:7px}
.dot{width:7px; height:7px; border-radius:2px; flex:none; background:var(--red)}
.loc.rh .dot{background:var(--holo)}
.loc.off .dot{background:var(--faint)}
.stripe p{
  margin:0; font-family:var(--mono); font-size:10.5px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--red-ink);
}
.loc.rh .stripe p{color:var(--holo-ink)}
.loc.off .stripe p{color:var(--faint)}
.stripe s{margin-left:auto; text-decoration:none; font-family:var(--mono); font-size:9.5px; color:var(--faint); font-variant-numeric:tabular-nums}

.readout{display:flex; align-items:baseline; gap:8px}
.readout .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.readout .v{
  font-family:var(--disp); font-stretch:62%; font-weight:700; font-size:34px; line-height:.8;
  font-variant-numeric:tabular-nums;
}
.spotline{margin:0; font-family:var(--disp); font-stretch:80%; font-weight:600; font-size:14px; line-height:1.2}
.spotline em{font-style:normal; font-family:var(--mono); font-size:11px; font-weight:400; color:var(--dim); display:block; margin-top:3px; letter-spacing:.03em}
.slotline{margin:0; font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--faint); font-variant-numeric:tabular-nums}
.nope{margin:0; font-family:var(--disp); font-stretch:80%; font-size:14px; line-height:1.35; color:var(--dim); max-width:22ch}

/* pocket grid glyph — a button in card view, where it opens that binder page.
   Same spread cue as the page view, at glyph scale: the leaf sits on its real
   side and the facing leaf is a clipped 15% sliver. */
/* at this scale a clipped preview of the facing leaf just reads as a broken 4th
   column, so the spine itself is drawn instead: the glyph sits on its real side
   of that line, which is the whole point of the cue */
.pktwrap{display:flex; align-items:stretch; gap:3px; width:66px}
.pktwrap > .pkt{flex:1 1 auto; width:auto}
.pktspine{flex:0 0 15px; position:relative; pointer-events:none}
/* a recessed crease, not a drawn line: a hairline lighter than the panel vanished
   in dark mode, and a shadow reads as a gutter in both themes. ::before is the
   crease against the leaf, ::after the facing leaf ghosted beyond it — on a dark
   panel that pale edge is what gives the near-black crease something to read
   against, since black on black can only go so far. */
.pktspine::before{
  content:""; position:absolute; top:-2px; bottom:-2px; width:4px; border-radius:2px; z-index:1;
  background:linear-gradient(90deg, rgba(0,0,0,0), var(--crease) 45%, var(--crease) 55%, rgba(0,0,0,0));
}
.pktspine::after{
  content:""; position:absolute; top:2px; bottom:2px; width:8px;
  background:var(--pocket); border:1px solid var(--pocket-line); opacity:.6;
}
.pktwrap.left  .pktspine::before{left:1px}
.pktwrap.left  .pktspine::after{right:0; border-left:0;  border-radius:0 4px 4px 0}
.pktwrap.right .pktspine::before{right:1px}
.pktwrap.right .pktspine::after{left:0;  border-right:0; border-radius:4px 0 0 4px}
.pktspine.blank::before,
.pktspine.blank::after{display:none}
.pkt{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; width:48px; padding:0}
button.pkt:hover i:not(.on){border-color:var(--red)}
button.pkt:active{transform:scale(.94)}
.pkt i{display:block; aspect-ratio:5/7; border-radius:2px; background:var(--pocket); border:1px solid var(--pocket-line)}
.pkt i.on{background:var(--red); border-color:var(--red); animation:pop .28s cubic-bezier(.2,1.3,.5,1)}
.loc.rh .pkt i.on{background:var(--holo); border-color:var(--holo)}
@keyframes pop{from{transform:scale(.55); opacity:.3} to{transform:scale(1); opacity:1}}

/* also-printed strip */
.also{padding:12px 14px 14px; border-top:1px solid var(--line-soft)}
.also h2{margin:0 0 9px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  display:flex; align-items:center; gap:7px; padding:6px 10px 6px 8px; border-radius:8px;
  background:var(--sunk); border:1px solid var(--line-soft);
}
.chip b{font-family:var(--mono); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
.chip span{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}
.chip:hover{border-color:var(--red); color:var(--red-ink)}

/* ---------- binder spread ---------- */
/* the facing leaf, rendered at true scale inside a 15% window and clipped to
   its inner edge, so the page visibly sits left or right of the spine */
.spread{display:flex; align-items:stretch; gap:5px}
.spread > .panel{flex:1 1 auto; min-width:0}
.ghost{
  position:relative; flex:0 0 15%; overflow:hidden; pointer-events:none;
  opacity:.26; filter:saturate(.45); border-radius:14px;
}
.ghost.bare{opacity:1; filter:none}          /* outer edge of the binder: nothing faces it */
.ghost .mini{position:absolute; top:0; width:566.667%}
.spread.right .ghost .mini{right:0}          /* page is on the right, so we see the facing page's right edge */
.spread.left  .ghost .mini{left:0}           /* page is on the left, so we see the facing page's left edge */

/* page view */
.pghead{display:flex; align-items:center; justify-content:space-between; gap:9px; padding:4px 10px; border-bottom:1px solid var(--line-soft)}
.pghead h1{margin:0; font-family:var(--disp); font-stretch:62%; font-weight:700; font-size:19px; line-height:.85; font-variant-numeric:tabular-nums}
.pghead h1 i{font-family:var(--mono); font-style:normal; font-size:9px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); display:block; margin-bottom:3px; font-stretch:100%}
.step{display:flex; gap:6px}
.step button{width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--panel); display:grid; place-items:center; font-family:var(--mono); font-size:14px; color:var(--dim)}
.step button:disabled{opacity:.32; cursor:default}
.step button:not(:disabled):hover{border-color:var(--red); color:var(--red-ink)}

/* 4px tighter than the rest of the app so all three rows clear the keypad at 660px tall */
.sheet{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:5px}
/* height follows the content so a whole binder page fits without scrolling */
.pocket{
  border-radius:7px; border:1px solid var(--pocket-line); background:var(--pocket);
  padding:5px 5px 4px; display:flex; flex-direction:column; gap:0; text-align:left; overflow:hidden;
}
.pocket:hover{border-color:var(--red)}
/* must stay one line: a wrapped "6 · Middle Right" adds a row's worth of height
   to every pocket and pushes the bottom row behind the keypad */
.pocket .sp{font-family:var(--mono); font-size:7.5px; letter-spacing:.01em; color:var(--faint); white-space:nowrap; overflow:hidden}
.pocket .cn{font-family:var(--mono); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1}
.pocket .nm{font-family:var(--disp); font-stretch:70%; font-weight:600; font-size:11.5px; line-height:1.1; min-height:2.2em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word}
/* the version line is half the identity of a Lorcana card, so it gets its own block */
.pocket .ver{font-family:var(--disp); font-stretch:70%; font-weight:400; font-size:8.5px; line-height:1.15; min-height:2.3em; color:var(--dim); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word}
/* slots past the last card on a part-empty page */
.pocket.none{background:none; border-style:dashed; opacity:.4}
body.marking .pocket.none::after{display:none}
.foot{
  margin-top:auto; padding-top:6px; border-top:1px solid var(--pocket-line);
  display:flex; align-items:baseline; justify-content:space-between; gap:4px;
  font-family:var(--mono); font-size:8px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint);
  white-space:nowrap; overflow:hidden;   /* "Double rare" + slot must not wrap onto a second line */
}
.foot b{font-weight:400; font-variant-numeric:tabular-nums; letter-spacing:.02em}
/* reverse holos wear a brass foil edge rather than a filled tint */
.pocket.rh{box-shadow:inset 0 3px 0 var(--holo)}
.pocket.rh .foot{color:var(--holo-ink); font-weight:600}
.pocket.hi{border-color:var(--red); box-shadow:0 0 0 2px var(--red-soft)}
.pocket.rh.hi{box-shadow:inset 0 3px 0 var(--holo), 0 0 0 2px var(--red-soft)}

/* ---------- owned ---------- */
/* a filled pocket is stated once, quietly: a tick and a tinted edge, never a
   colour swap that would fight the holo and secret cues already in the grid */
.pocket{position:relative}
.pocket.got{border-color:var(--ok)}
/* the box has to be described once for both states: give it only to .got and the
   empty one lands in the flex flow as a bar across the bottom of the pocket */
.pocket.got::after,
body.marking .pocket::after{
  content:""; position:absolute; top:3px; right:4px; width:13px; height:13px;
  display:grid; place-items:center; border-radius:50%; box-sizing:border-box;
  font-size:9px; font-weight:700; line-height:1;
}
.pocket.got::after{content:"\2713"; background:var(--ok); color:var(--panel)}
/* in Own mode every pocket shows its checkbox, so the empty ones read as targets */
body.marking .pocket:not(.got)::after{background:none; border:1.5px dashed var(--pocket-line)}
body.marking .sheet{outline:2px solid var(--ok); outline-offset:-1px; border-radius:8px}
.tick{
  font-family:var(--mono); font-size:10px; font-variant-numeric:tabular-nums; color:var(--faint);
  border:1px solid var(--line-soft); border-radius:6px; padding:3px 6px; margin-left:auto;
}
.tick.full{color:var(--ok); border-color:var(--ok); background:var(--ok-soft); font-weight:600}
.loc .own{
  margin-top:8px; align-self:flex-start; padding:5px 9px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel);
  font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
}
.loc.got .own{border-color:var(--ok); background:var(--ok-soft); color:var(--ok); font-weight:600}
.bar2{height:7px; border-radius:4px; background:var(--sunk); border:1px solid var(--line-soft); overflow:hidden}
.bar2 i{display:block; height:100%; background:var(--ok); border-radius:4px}
.prog{margin:9px 0 0; font-family:var(--disp); font-stretch:80%; font-size:14px; color:var(--dim)}
.prog b{font-family:var(--mono); font-size:13px; color:var(--ink)}
.acts{display:flex; gap:7px; margin-top:11px}
.acts button{
  padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
  font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim);
}
.acts button:hover{border-color:var(--red); color:var(--red-ink)}

/* results list */
.list{display:flex; flex-direction:column}
.row{
  display:flex; align-items:center; gap:12px; padding:11px 14px; text-align:left;
  border-bottom:1px solid var(--line-soft); width:100%;
}
.row:last-child{border-bottom:0}
.row .cn{font-family:var(--mono); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--dim); flex:none; width:38px}
.row .nm{font-family:var(--disp); font-stretch:80%; font-weight:600; font-size:16px; min-width:0; flex:1; line-height:1.15}
.row .rr{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); flex:none}
.row:hover{background:var(--sunk)}
.row:hover .cn{color:var(--red-ink)}

.note{padding:22px 16px; text-align:center}
.note p{margin:0; font-family:var(--disp); font-stretch:80%; font-size:15px; color:var(--dim); line-height:1.45}
.note p b{color:var(--ink); font-weight:600}

/* legend / empty state */
.legend{padding:15px 16px}
.legend h2{margin:0 0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400}
.legend ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.legend li{display:flex; gap:10px; align-items:baseline; font-family:var(--disp); font-stretch:80%; font-size:14px; line-height:1.35; color:var(--dim)}
.legend li b{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink); flex:none; width:68px; letter-spacing:.02em; white-space:nowrap}
.tally{display:flex; gap:0; border-top:1px solid var(--line-soft)}
.tally div{flex:1; padding:12px 6px; text-align:center; border-right:1px solid var(--line-soft)}
.tally div:last-child{border-right:0}
.tally b{display:block; font-family:var(--disp); font-stretch:62%; font-weight:700; font-size:24px; line-height:1; font-variant-numeric:tabular-nums}
.tally span{display:block; margin-top:5px; font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}

/* ---------- keypad ---------- */
.pad{
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  background:var(--bg); border-top:1px solid var(--line-soft);
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  transition:transform .18s ease;
}
body.nokeys .pad{transform:translateY(105%); pointer-events:none}
.keys{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:540px; margin:0 auto}
.keys button{padding:11px 0; border-radius:9px; background:var(--panel); border:1px solid var(--line);
  font-family:var(--mono); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; box-shadow:var(--shadow)}
.keys button:active{background:var(--sunk)}
.keys button.alt{font-size:13px; color:var(--dim); font-weight:400}
.keys button.alt:hover{color:var(--red-ink); border-color:var(--red)}

/* ---------- floating keypad button ---------- */
/* shows only while the pad is retracted, so the bottom edge is never dead */
.fab{
  position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:26;
  width:56px; height:56px; border-radius:50%; border:1.5px solid var(--red);
  background:var(--panel); color:var(--red-ink); box-shadow:var(--shadow);
  display:none; place-items:center;
}
body.nokeys .fab{display:grid}
.fab:active{transform:scale(.94)}
.fabdots{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; place-items:center}
.fabdots i{display:block; width:4px; height:4px; border-radius:1px; background:currentColor}

@media (min-width:520px){
  .no{font-size:46px}
  .sheet{gap:9px; padding:14px}
  .pocket .nm{font-size:13.5px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="top">
      <span class="crest">AOV</span>
      <div class="modes" role="tablist" aria-label="Lookup mode">
        <button role="tab" id="tab-card" aria-selected="true" data-mode="card">Card</button>
        <button role="tab" id="tab-page" aria-selected="false" data-mode="page">Page</button>
      </div>
      <button class="keytog owntog" id="owntog" aria-pressed="false">Own</button>
      <button class="keytog fxtog" id="fxtog" aria-pressed="true" aria-label="Tap feedback">&#9834;</button>
      <button class="keytog" id="keytog" aria-pressed="true">Hide</button>
    </div>
    <div class="field">
      <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" aria-label="Search" placeholder="Card number or name" />
      <button class="wipe" id="wipe" hidden aria-label="Clear">&times;</button>
    </div>
    <p class="hint" id="hint"></p>
  </header>

  <main id="out" aria-live="polite"></main>
</div>

<footer class="pad" id="pad">
  <div class="keys" id="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="back" class="alt" aria-label="Backspace">&#9003;</button>
    <button data-k="0">0</button>
    <button data-k="clear" class="alt" aria-label="Clear">clear</button>
  </div>
</footer>

<button class="fab" id="fab" aria-label="Show keypad" aria-controls="pad">
  <span class="fabdots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
</button>

<script>
/* ---------- data ---------- */
const CARDS = /*__DATA__*/;
const SPOTS = ["Top Left","Top Middle","Top Right","Middle Left","Center","Middle Right","Bottom Left","Bottom Middle","Bottom Right"];
const ALIAS = {};
// #001-207 are the base set and each exists non-foil and in Silver foil;
// #208-247 (Epic, Enchanted, Iconic and two stragglers) are foil-only singles
const BASE = 207, LAST = 247;
const SPECIAL = new Set(["Legendary","Super Rare","Epic","Enchanted","Iconic"]);

/* ---------- slot map ---------- */
const reg = {}, rh = {}, atSlot = [];
(function(){
  let s = 1;
  const place = (n, isRh) => { atSlot[s] = {n, rh:isRh}; return s++; };
  for (let n = 1; n <= BASE; n++){ reg[n] = place(n, false); rh[n] = place(n, true); }
  for (let n = BASE + 1; n <= LAST; n++) reg[n] = place(n, false);
})();
const TOTAL = 454, PAGES = 51;

const page = s => Math.ceil(s / 9);
const spot = s => ((s - 1) % 9) + 1;
const card = n => CARDS[n - 1];
// past #207 a card has one printing only, and its rarity is the interesting
// thing about it; inside the base set the first pocket is always the plain one
const baseLabel = n => n > BASE ? card(n).r : "Non-foil";
const norm = t => t.toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

/* ---------- state ---------- */
const out = document.getElementById("out");
const q = document.getElementById("q");
const hint = document.getElementById("hint");
const wipe = document.getElementById("wipe");
let mode = "card";

const PLACEHOLDER = {card:"Card number or name", page:"Page number, 1 to 51"};
const HINTS = {
  card:'<b>67</b> a card &middot; <b>p14</b> a page &middot; <b>stitch</b> a name',
  page:'Pages <b>1</b> to <b>51</b>. Tap a pocket to open that card.'
};

function setMode(m){
  mode = m;
  document.getElementById("tab-card").setAttribute("aria-selected", String(m === "card"));
  document.getElementById("tab-page").setAttribute("aria-selected", String(m === "page"));
  q.placeholder = PLACEHOLDER[m];
  hint.innerHTML = HINTS[m];
  q.value = "";
  render();
}

/* ---------- query parsing ---------- */
function parse(raw){
  const t = raw.trim();
  if (!t) return {kind:"empty"};
  let m = t.match(/^p(?:age|g)?[\s.:#-]*(\d{1,3})$/i);
  if (m) return {kind:"page", n:+m[1]};
  m = t.match(/^[#no.\s]*0*(\d{1,3})$/i);
  if (m) return {kind: mode === "page" ? "page" : "card", n:+m[1]};
  m = t.match(/^(?:slot|s)[\s.:#-]*(\d{1,3})$/i);
  if (m) return {kind:"slot", n:+m[1]};
  return {kind:"name", t:norm(t)};
}

function search(term){
  const hits = [];
  for (let n = 1; n <= LAST; n++){
    const hay = norm(card(n).name) + " " + (ALIAS[n] || "");
    const i = hay.indexOf(term);
    if (i === 0) hits.push({n, rank:0});
    else if (i > 0) hits.push({n, rank:1});
  }
  hits.sort((a, b) => a.rank - b.rank || a.n - b.n);
  return hits.map(h => h.n);
}

/* ---------- owned pockets ---------- */
// A collection is worth nothing if it evaporates. Safari evicts localStorage for
// a site you have not opened in 7 days, so the set is also encodable into the URL
// as 454 bits of base64: one link is a backup that outlives the browser.
let owned = new Set();
const ownedBits = () => { let s = ""; for (let i = 1; i <= TOTAL; i++) s += owned.has(i) ? "1" : "0"; return s; };
const bitsToSet = s => { const o = new Set(); for (let i = 0; i < s.length && i < TOTAL; i++) if (s[i] === "1") o.add(i + 1); return o; };
function ownedB64(){
  const s = ownedBits(); let bin = "";
  for (let i = 0; i < s.length; i += 8) bin += String.fromCharCode(parseInt(s.slice(i, i + 8).padEnd(8, "0"), 2));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64(b){
  try {
    const bin = atob(b.replace(/-/g, "+").replace(/_/g, "/"));
    let s = "";
    for (let i = 0; i < bin.length; i++) s += bin.charCodeAt(i).toString(2).padStart(8, "0");
    return bitsToSet(s);
  } catch (e) { return null; }
}
function saveOwned(){ try { localStorage.setItem("vine.owned", ownedBits()); } catch (e) {} }
function loadOwned(){
  const m = location.hash.match(/o=([A-Za-z0-9_-]+)/);
  if (m){ const o = fromB64(m[1]); if (o){ owned = o; saveOwned(); return; } }
  try { owned = bitsToSet(localStorage.getItem("vine.owned") || ""); } catch (e) {}
}
const haveOnPage = p => { let n = 0; for (let i = 0; i < 9; i++) if (owned.has((p - 1) * 9 + 1 + i)) n++; return n; };

/* ---------- rendering ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pad3 = n => String(n).padStart(3, "0");

// with a slot the glyph is tappable and opens that binder page with the pocket lit;
// the dead panel has no page to open, so it stays decorative. Either way it sits
// on the leaf's real side of the spine, with the facing leaf ghosted beside it.
function glyph(s, slot){
  let g = "";
  for (let i = 1; i <= 9; i++) g += '<i class="' + (i === s ? "on" : "") + '"></i>';
  // no slot means no pocket at all, so there is no leaf and no spine to draw
  if (!slot)
    return '<div class="pktwrap" aria-hidden="true"><div class="pkt">' + g +
      '</div><span class="pktspine blank"></span></div>';

  // every leaf is bound on its inner edge: left for a right-hand page, right for a left-hand one
  const p = page(slot), odd = p % 2 === 1;
  const spine = '<span class="pktspine" aria-hidden="true"></span>';
  const pkt = '<button class="pkt" data-slot="' + slot + '" aria-label="Open binder page ' + p + '">' + g + "</button>";
  return '<div class="pktwrap ' + (odd ? "right" : "left") + '">' + (odd ? spine + pkt : pkt + spine) + "</div>";
}

function locPanel(slot, kind, n){
  const cls = kind === "rh" ? "loc rh" : "loc";
  const label = kind === "rh" ? "Foil" : baseLabel(n);
  const p = page(slot), s = spot(slot);
  const have = owned.has(slot);
  return '<section class="' + cls + (have ? " got" : "") + '">' +
    '<div class="stripe"><span class="dot"></span><p>' + label + '</p><s>' + slot + '</s></div>' +
    '<div class="readout"><span class="k">Page</span><span class="v">' + p + '</span></div>' +
    '<p class="spotline">' + SPOTS[s - 1] + '<em>Spot ' + s + ' of 9</em></p>' +
    glyph(s, slot) +
    '<button class="own" data-own="' + slot + '" aria-pressed="' + have + '">' +
      (have ? "&#10003; Have it" : "Mark as owned") + '</button>' +
    '</section>';
}

function deadPanel(reason){
  return '<section class="loc rh off">' +
    '<div class="stripe"><span class="dot"></span><p>Foil</p></div>' +
    '<p class="nope">' + reason + '</p>' +
    glyph(0) +
    '<p class="slotline">One pocket only</p>' +
    '</section>';
}

function cardView(n){
  const c = card(n);
  const others = [];
  for (let i = 1; i <= LAST; i++) if (i !== n && card(i).name === c.name) others.push(i);

  let html = '<article class="panel">' +
    '<div class="head">' +
      '<div class="no"><i>#</i>' + pad3(n) + '</div>' +
      '<div class="who"><h1>' + esc(c.name) + '</h1><div class="tags">' +
        '<span class="tag' + (SPECIAL.has(c.r) ? " hot" : "") + '">' + esc(c.r) + '</span>' +
        '<span class="tag">' + esc(c.t) + '</span>' +
      '</div></div>' +
    '</div>' +
    '<div class="locs">' + locPanel(reg[n], "reg", n);

  if (rh[n]) html += locPanel(rh[n], "rh");
  else html += deadPanel("Cards #208 to #247 are foil-only singles with no second printing.");

  html += "</div>";

  if (others.length){
    html += '<div class="also"><h2>Same card, other prints</h2><div class="chips">';
    for (const o of others)
      html += '<button class="chip" data-card="' + o + '"><b>#' + pad3(o) + '</b><span>' + esc(card(o).r) + '</span></button>';
    html += "</div></div>";
  }
  return html + "</article>";
}

function pageView(p, hi){
  const start = (p - 1) * 9 + 1;
  // 454 pockets do not divide into 9, so the last page is part empty
  let real = 0;
  for (let i = 0; i < 9; i++) if (atSlot[start + i]) real++;
  const got = haveOnPage(p);
  let html = '<article class="panel">' +
    '<div class="pghead">' +
      '<h1><i>Binder page &middot; slots ' + start + "&ndash;" + (start + 8) + '</i>' + p + '</h1>' +
      '<span class="tick' + (got === real ? " full" : "") + '">' + got + '/' + real + '</span>' +
      '<div class="step">' +
        '<button data-page="' + (p - 1) + '"' + (p <= 1 ? " disabled" : "") + ' aria-label="Previous page">&#8592;</button>' +
        '<button data-page="' + (p + 1) + '"' + (p >= PAGES ? " disabled" : "") + ' aria-label="Next page">&#8594;</button>' +
      '</div>' +
    '</div><div class="sheet">';

  for (let i = 0; i < 9; i++){
    const s = start + i, e = atSlot[s];
    if (!e){ html += '<span class="pocket none" aria-hidden="true"></span>'; continue; }
    const c = card(e.n);
    html += '<button class="pocket' + (e.rh ? " rh" : "") + (s === hi ? " hi" : "") +
      (owned.has(s) ? " got" : "") + '" data-card="' + e.n + '" data-slot2="' + s + '">' +
      '<span class="cn">#' + pad3(e.n) + '</span>' +
      '<span class="nm">' + esc(c.name.split(" - ")[0]) + '</span>' +
      '<span class="ver">' + esc(c.name.split(" - ")[1] || "") + '</span>' +
      '<span class="foot"><span>' + (e.rh ? "Foil" : baseLabel(e.n)) + '</span>' +
      '<b>' + s + '</b></span>' +
      '</button>';
  }
  return html + "</div></article>";
}

// In a real binder page 1 sits alone on the right, then 2|3, 4|5 ... pair up as
// spreads. Odd pages are right-hand leaves, even pages left-hand ones, so the
// facing leaf is p-1 for odd and p+1 for even. It is drawn at true scale and
// clipped to a sliver, purely as a cue to where you are in the binder.
function spreadView(p, hi){
  const odd = p % 2 === 1;
  const facing = odd ? p - 1 : p + 1;
  const ghost = (facing >= 1 && facing <= PAGES)
    ? '<div class="ghost" aria-hidden="true"><div class="mini">' + pageView(facing) + "</div></div>"
    : '<div class="ghost bare" aria-hidden="true"></div>';   // outer edge of the binder
  const main = pageView(p, hi);
  return '<div class="spread ' + (odd ? "right" : "left") + '">' +
    (odd ? ghost + main : main + ghost) + "</div>";
}

function listView(ns, term){
  if (!ns.length)
    return '<div class="panel note"><p>Nothing matches <b>' + esc(term) + '</b>. Try a card number from <b>1</b> to <b>247</b>.</p></div>';
  if (ns.length === 1) return cardView(ns[0]);
  let html = '<div class="panel list">';
  for (const n of ns.slice(0, 40))
    html += '<button class="row" data-card="' + n + '"><span class="cn">#' + pad3(n) + '</span>' +
      '<span class="nm">' + esc(card(n).name) + '</span><span class="rr">' + esc(card(n).r) + '</span></button>';
  html += "</div>";
  if (ns.length > 40) html += '<div class="panel note"><p>Showing 40 of ' + ns.length + ' matches. Keep typing to narrow it down.</p></div>';
  return html;
}

function home(){
  return '<div class="panel legend">' +
      '<h2>How this binder is ordered</h2><ul>' +
      '<li><b>#001&ndash;207</b><span>Collector order. Each card is followed immediately by its Silver foil.</span></li>' +
      '<li><b>#208&ndash;247</b><span>Epic, Enchanted and Iconic. Foil only, so one pocket each.</span></li>' +
      '<li><b>Promos</b><span>The 22 Special promos reuse base numbers and sit outside this binder.</span></li>' +
      '</ul></div>' +
    '<div class="panel"><div class="tally">' +
      '<div><b>207</b><span>Base</span></div>' +
      '<div><b>207</b><span>Foil</span></div>' +
      '<div><b>40</b><span>Special</span></div>' +
      '<div><b>454</b><span>Pockets</span></div>' +
    '</div></div>' +
    '<div class="panel legend"><h2>Your collection</h2>' +
      '<div class="bar2"><i style="width:' + (owned.size / TOTAL * 100).toFixed(2) + '%"></i></div>' +
      '<p class="prog"><b>' + owned.size + '</b> of ' + TOTAL + ' pockets filled' +
        (owned.size ? ' &middot; <b>' + (TOTAL - owned.size) + '</b> to go' : '') + '</p>' +
      '<div class="acts"><button id="backup">Copy backup link</button>' +
        (owned.size ? '<button id="wipeowned">Clear</button>' : '') + '</div>' +
    '</div>';
}

function render(){
  armStale();
  draw();
  syncPad();
}
function draw(){
  const r = parse(q.value);
  wipe.hidden = !q.value;
  hint.hidden = !!q.value.trim();
  hint.innerHTML = HINTS[mode];

  if (r.kind === "empty"){ out.innerHTML = mode === "page" ? spreadView(1) : home(); return; }

  if (r.kind === "card"){
    out.innerHTML = (r.n >= 1 && r.n <= LAST)
      ? cardView(r.n)
      : '<div class="panel note"><p>There is no card <b>#' + r.n + '</b>. This set runs <b>#001</b> to <b>#247</b>.</p></div>';
    return;
  }
  if (r.kind === "page"){
    out.innerHTML = (r.n >= 1 && r.n <= PAGES)
      ? spreadView(r.n)
      : '<div class="panel note"><p>Page <b>' + r.n + '</b> is past the end. The binder has <b>51</b> pages.</p></div>';
    return;
  }
  if (r.kind === "slot"){
    if (r.n >= 1 && r.n <= TOTAL) out.innerHTML = spreadView(page(r.n), r.n);
    else out.innerHTML = '<div class="panel note"><p>Slot <b>' + r.n + '</b> is out of range. The binder holds <b>454</b> cards.</p></div>';
    return;
  }
  out.innerHTML = listView(search(r.t), q.value.trim());
}

/* ---------- events ---------- */
q.addEventListener("input", render);

document.querySelectorAll(".modes button").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));

wipe.addEventListener("click", () => { q.value = ""; render(); q.focus(); });

const padEl = document.getElementById("pad");
const keytog = document.getElementById("keytog");

function syncPad(){
  // when the pad is retracted the fab takes its place, so keep clearance for it
  const hidden = document.body.classList.contains("nokeys");
  const h = hidden ? 14 + 62 : padEl.offsetHeight + 14;
  out.style.paddingBottom = h + "px";
}
// only a deliberate press of the toggle is a saved preference; an auto-hide is transient
function setKeys(on, remember){
  document.body.classList.toggle("nokeys", !on);
  keytog.textContent = on ? "Hide" : "Keys";
  keytog.setAttribute("aria-pressed", String(on));
  if (remember) { try { localStorage.setItem("vine.keys", on ? "1" : "0"); } catch (e) {} }
  syncPad();
}
keytog.addEventListener("click", () => setKeys(document.body.classList.contains("nokeys"), true));

// reading a result means you are done typing for a moment, so give the page the room.
// touchmove/wheel, never "scroll" — the app scrolls itself after a pocket tap.
function autoHide(){
  if (!document.body.classList.contains("nokeys")) setKeys(false, false);
}
out.addEventListener("wheel", autoHide, {passive:true});
out.addEventListener("pointerdown", e => { if (!e.target.closest("button")) autoHide(); });

const fab = document.getElementById("fab");
fab.addEventListener("click", () => setKeys(true, true));

/* ---------- tap feedback ---------- */
// One channel per platform: a real haptic where the device offers one, and a
// synthesised click where it does not. iOS Safari exposes no Vibration API at
// all, so the click is what lands there -- and iOS plays Web Audio in the
// ambient category, so the ring switch silences it. Nothing to detect that by.
const fxtog = document.getElementById("fxtog");
let fxOn = true;
try { fxOn = localStorage.getItem("vine.fx") !== "0"; } catch (e) {}
const canBuzz = typeof navigator.vibrate === "function";

let actx = null;
function clickTone(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(1150, t);
    osc.frequency.exponentialRampToValueAtTime(620, t + 0.025);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.05, t + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);
    osc.connect(gain).connect(actx.destination);
    osc.start(t); osc.stop(t + 0.032);
  } catch (e) {}
}
function fxTap(){
  if (!fxOn) return;
  if (canBuzz) { try { navigator.vibrate(8); } catch (e) {} }
  else clickTone();
}
function setFx(on, remember){
  fxOn = on;
  document.body.classList.toggle("nofx", !on);
  fxtog.setAttribute("aria-pressed", String(on));
  if (remember) { try { localStorage.setItem("vine.fx", on ? "1" : "0"); } catch (e) {} }
}
// capture, so every button in the app fires it without each handler opting in,
// and on press rather than release, which is where a tap wants to be answered
document.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) fxTap();
}, true);
fxtog.addEventListener("click", () => setFx(!fxOn, true));
setFx(fxOn, false);

/* ---------- swipe between binder pages ---------- */
// which page the results area is showing right now, or 0 if it is not a page view
function shownPage(){
  const r = parse(q.value);
  if (r.kind === "page" && r.n >= 1 && r.n <= PAGES) return r.n;
  if (r.kind === "slot" && r.n >= 1 && r.n <= TOTAL) return page(r.n);
  if (r.kind === "empty" && mode === "page") return 1;
  return 0;
}
function goPage(p){
  if (p < 1 || p > PAGES) return;
  setMode("page");
  q.value = String(p);
  render();
}

const SWIPE_MIN = 45, SWIPE_MS = 700;
let tStart = null, lastSwipe = 0;

out.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  tStart = {x:t.clientX, y:t.clientY, at:Date.now()};
}, {passive:true});

// a sideways drag is navigation, not reading, so it must not retract the keypad
out.addEventListener("touchmove", e => {
  if (!tStart) { autoHide(); return; }
  const t = e.changedTouches[0];
  if (Math.abs(t.clientY - tStart.y) > Math.abs(t.clientX - tStart.x)) autoHide();
}, {passive:true});

out.addEventListener("touchend", e => {
  const s = tStart; tStart = null;
  if (!s) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Date.now() - s.at > SWIPE_MS) return;
  if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 2) return;
  const cur = shownPage();
  if (!cur) return;
  lastSwipe = Date.now();
  goPage(cur + (dx < 0 ? 1 : -1));
}, {passive:true});

// a pause means you have moved on to the next card
const IDLE = 2500;
let staleTimer = null;
function armStale(){
  clearTimeout(staleTimer);
  document.body.classList.remove("stale");
  if (q.value) staleTimer = setTimeout(() => document.body.classList.add("stale"), IDLE);
}

document.getElementById("keys").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const k = b.dataset.k;
  if (k === "back") q.value = q.value.slice(0, -1);
  else if (k === "clear") q.value = "";
  else {
    // a digit that would push the entry past the highest card (207) or page (40)
    // can only be the start of the next number, so restart rather than build junk
    const digits = /^\d*$/.test(q.value);
    const cand = q.value + k;
    const over = digits && parseInt(cand, 10) > (mode === "page" ? PAGES : LAST);
    q.value = (document.body.classList.contains("stale") || !digits || over) ? k : cand;
  }
  armStale();
  render();
});

out.addEventListener("click", e => {
  // a swipe that ends on a pocket still fires a click; that is navigation already done
  if (Date.now() - lastSwipe < 400) return;

  const act = e.target.closest("#backup,#wipeowned,[data-own]");
  if (act){
    if (act.id === "backup") return copyBackup(act);
    if (act.id === "wipeowned") return clearOwned();
    return toggleOwned(+act.dataset.own);
  }
  // in Own mode a pocket is a checkbox, not a link: you are logging, not looking up
  const pk = e.target.closest("[data-slot2]");
  if (pk && document.body.classList.contains("marking")) return toggleOwned(+pk.dataset.slot2);

  const t = e.target.closest("[data-card],[data-page],[data-slot]");
  if (!t) return;
  if (t.dataset.card){
    setMode("card");
    q.value = t.dataset.card;
  } else if (t.dataset.slot){
    setMode("page");
    q.value = "s" + t.dataset.slot;   // opens the page with that pocket lit
  } else {
    setMode("page");
    q.value = t.dataset.page;
  }
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});

/* ---------- owned: actions ---------- */
function toggleOwned(slot){
  if (!slot) return;
  if (owned.has(slot)) owned.delete(slot); else owned.add(slot);
  saveOwned();
  draw();            // not render(): marking is not typing, so leave the stale timer alone
}
function clearOwned(){
  if (!confirm("Clear all " + owned.size + " owned marks? This cannot be undone.")) return;
  owned = new Set(); saveOwned(); draw();
}
function copyBackup(btn){
  const url = location.origin + location.pathname + "#o=" + ownedB64();
  const done = ok => { btn.textContent = ok ? "Link copied" : "Copy failed"; setTimeout(() => { btn.textContent = "Copy backup link"; }, 1800); };
  try { navigator.clipboard.writeText(url).then(() => done(true), () => done(false)); }
  catch (e) { done(false); }
}
const owntog = document.getElementById("owntog");
function setMarking(on){
  document.body.classList.toggle("marking", on);
  owntog.setAttribute("aria-pressed", String(on));
  owntog.textContent = on ? "Done" : "Own";
}
owntog.addEventListener("click", () => setMarking(!document.body.classList.contains("marking")));

loadOwned();
hint.innerHTML = HINTS.card;
q.placeholder = PLACEHOLDER.card;
let keysOn = true;
try { keysOn = localStorage.getItem("vine.keys") !== "0"; } catch (e) {}
setKeys(keysOn, false);
render();
new ResizeObserver(syncPad).observe(padEl);
window.addEventListener("resize", syncPad);
if (window.matchMedia("(hover: hover)").matches) q.focus();
</script>
</body>
